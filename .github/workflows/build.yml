name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore .\WarpinatorWinClient.sln

      - name: Build
        run: dotnet build .\WarpinatorWinClient.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish .\WarpinatorWinClient.App\WarpinatorWinClient.App.csproj --configuration Release --runtime win-x64 --self-contained false --output .\publish\win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warpinator-windows-client-win-x64
          path: .\publish\win-x64
